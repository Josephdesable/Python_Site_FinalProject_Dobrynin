{% extends 'listings/base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <h3 class="mb-4">Регистрация</h3>
    <form method="post" class="card p-4">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-success w-100 mt-3">Создать аккаунт</button>
    </form>
    <p class="mt-3 text-muted small">Уже есть аккаунт? <a href="{% url 'listings:login' %}">Войти</a></p>
  </div>
</div>
{% endblock %}
