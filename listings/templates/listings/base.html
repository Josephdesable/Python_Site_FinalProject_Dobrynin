<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Аренда одежды{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'listings:listing_list' %}">👗 ClothingRent</a>
      <div class="ms-auto d-flex align-items-center gap-2">
        
        {% if user.is_authenticated %}
          <span class="text-light me-2">{{ user.username }}</span>
          <a href="{% url 'listings:create_ad' %}" class="btn btn-success btn-sm me-2">+ Объявление</a>
          
          {% if user.is_staff %}
            <a href="{% url 'listings:approve_ad' %}" class="btn btn-warning btn-sm me-2">🔍 Модерация</a>
          {% endif %}
          
          <form method="post" action="/accounts/logout/" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
          </form>
          
        {% else %}
          <a href="{% url 'listings:login' %}" class="btn btn-outline-light btn-sm me-2">Войти</a>
          <a href="{% url 'listings:register' %}" class="btn btn-outline-light btn-sm">Регистрация</a>
        {% endif %}
        
      </div>
    </div>
  </nav>
  
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
